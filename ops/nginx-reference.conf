# ============================================================
# 【参考配置，本机不部署】
# 生产环境由宝塔面板托管：面板站点「即时通讯业务api中枢 / 即时通讯核心引擎」
# 生成 vhost 并反代到 127.0.0.1:65110 / 127.0.0.1:65103，见 ops/README.md 第 7 节。
# 本文件是等价的纯 Nginx 写法（多出 limit_req / limit_conn 限流），
# 只在没有面板的新环境里手工部署。
# ============================================================
# Nginx 站点配置 —— chat.djnovels.com（业务层） + im.djnovels.com（引擎长连接）
#
# 本机是宝塔面板环境，安装位置与常规发行版不同：
#   1. 把本文件放到 /www/server/panel/vhost/nginx/djnovels-im.conf
#      （宝塔的 nginx.conf 里已经 include 了 /www/server/panel/vhost/nginx/*.conf）
#   2. 证书用 /www/wwwroot/chat.djnovels.com/cert/{fullchain,privkey}.pem
#      —— 即 *.djnovels.com 的 Cloudflare 源站证书
#   3. nginx -t && nginx -s reload
#
# 注意：$connection_upgrade 这个 map 已经由宝塔的
# /www/server/panel/vhost/nginx/0.websocket.conf 定义过，本文件不能重复定义，
# 否则 nginx -t 会因为「duplicate map」直接报错。
#
# 公网只开放 80/443。引擎的 65101（服务端 API）、65102（Navigator）、
# 65109（管理台）与 MySQL 的 3306 一律不出宿主机回环，禁止在此处添加代理。
# ============================================================

limit_req_zone $binary_remote_addr zone=djnovels_api_rl:20m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=djnovels_ws_conn:20m;

server {
    listen 80;
    server_name chat.djnovels.com im.djnovels.com;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------
# 业务层 API：登录换 token、用户资料、好友、群、会话、历史。
# ---------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name chat.djnovels.com;

    ssl_certificate     /www/wwwroot/chat.djnovels.com/cert/fullchain.pem;
    ssl_certificate_key /www/wwwroot/chat.djnovels.com/cert/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 文件上传走业务层签发的预签名 URL，正常请求体很小；留 1m 余量。
    client_max_body_size 1m;

    location / {
        limit_req zone=djnovels_api_rl burst=100 nodelay;

        proxy_pass http://127.0.0.1:65110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}

# ---------------------------------------------------------------
# 引擎长连接：WebSocket 路径是 /im（不是 /websocket），
# /imbot 是机器人通道，/health 是探活。
#
# 只放行这三个路径，其余一律 404。原因：引擎的 WS 端口与 REST 端口共用
# 同一个 http mux（上游 launcher/main.go 把 ginEngine 挂在 "/" 和 "/jim/"），
# 照抄默认的 location / 会把整套业务 API 与 WebIM 页面从这个域名二次暴露。
# ---------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name im.djnovels.com;

    ssl_certificate     /www/wwwroot/chat.djnovels.com/cert/fullchain.pem;
    ssl_certificate_key /www/wwwroot/chat.djnovels.com/cert/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /im {
        limit_conn djnovels_ws_conn 20;

        proxy_pass http://127.0.0.1:65103;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接必须关掉缓冲与短超时，否则会周期性掉线。
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health {
        proxy_pass http://127.0.0.1:65103;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location / {
        return 404;
    }
}
