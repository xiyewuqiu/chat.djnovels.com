# 业务层的运行时配置模板。
# 部署时复制到业务层项目根目录的 conf/config.yml（该文件不入库）。
#
# 注意：业务层把配置路径写死为相对路径 conf/config.yml
# （commons/configures/configure.go:55），所以 PM2 的 cwd 必须是项目根目录。
#
# PM2 应用名：chat.djnovels.com（见项目根目录 ecosystem.config.js）
# 改完执行：pm2 restart chat.djnovels.com

port: 65110

# 引擎回调本服务的端口（机器人消息等）。只在回环内使用。
callbackPort: 65111

log:
  logPath: ./logs
  logName: jugglechat-server

mysql:
  user: root
  password: __DB_PASSWORD__
  address: 127.0.0.1:3306
  # 与引擎共用一个库，不要改成别的名字
  name: im_db

# 业务层调用引擎服务端 API 的地址
imApiDomain: http://127.0.0.1:65101

# 引擎回推事件时使用的本服务地址
callbackBaseUrl: http://127.0.0.1:65111

botConnector:
  domain: ""

commercial: false
