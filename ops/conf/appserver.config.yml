# 业务层的运行时配置模板。
# 部署时复制到业务层项目根目录的 conf/config.yml（该文件不入库）。
#
# 注意：业务层把配置路径写死为相对路径 conf/config.yml
# （commons/configures/configure.go:55），所以 PM2 的 cwd 必须是项目根目录。
#
# PM2 应用名：chat.djnovels.com（见项目根目录 ecosystem.config.js）
# 改完执行：pm2 restart chat.djnovels.com

port: 65110

# 引擎回调本服务的端口（机器人消息等）。只在回环内使用。
callbackPort: 65111

log:
  logPath: ./logs
  logName: jugglechat-server

mysql:
  user: root
  password: __DB_PASSWORD__
  address: 127.0.0.1:3306
  # 与引擎共用一个库，不要改成别的名字
  name: im_db

# 业务层调用引擎服务端 API 的地址
imApiDomain: http://127.0.0.1:65101

# 引擎回推事件时使用的本服务地址
callbackBaseUrl: http://127.0.0.1:65111

botConnector:
  domain: ""

commercial: false

# 服务端到服务端调用的共享密钥（/jim/internal/token）。
# 业务后端用它换 IM 凭据；留空等于关闭内部接口（默认拒绝）。
# 生成：openssl rand -base64 32。公网 Nginx 必须拒绝 /jim/internal/ 前缀。
serviceKey: __SERVICE_KEY__

# 认证与验证码防刷。留空即使用代码内置默认值，通常不需要改。
security:
  # 固定测试验证码 000000。生产必须保持 false：
  # 打开它等于允许任何人用任意手机号/邮箱登录。
  allow_fixed_verify_code: false
  # login_per_minute: 10            同一账号每分钟密码登录尝试上限
  # login_per_minute_per_ip: 120    同一 IP 每分钟登录尝试上限（兜底，防 NAT 误伤放宽）
  # verify_per_minute: 10           同一手机号/邮箱每分钟验证码校验上限
  # send_code_per_minute: 1         同一手机号/邮箱每分钟验证码下发上限
  # send_code_per_hour: 5           同一手机号/邮箱每小时验证码下发上限
  # send_code_per_hour_per_ip: 60   同一 IP 每小时验证码下发上限
