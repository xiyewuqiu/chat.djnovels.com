# IM 引擎（JuggleIM）的运行时配置模板。
# 部署时复制到 <引擎项目>/launcher/build/conf/config.yml（该目录被上游 .gitignore 忽略）。
#
# PM2 应用名：im.djnovels.com（见引擎项目 launcher/build/ecosystem.config.js）
# 改完执行：pm2 restart im.djnovels.com
#
# 端口全部使用高位端口，且只在回环内使用：公网入口永远是 Nginx 的 443。

# 客户端长连接端口（WebSocket），Nginx 代理 im.djnovels.com -> 127.0.0.1:65103
defaultPort: 65103

nodeName: jim-node-1
nodeHost: 127.0.0.1

# 必须保持 mysql：历史消息的过期清理只在 mysql 引擎下生效，
# 切成 mongo 后清理会静默失效（services/historymsg/services/purgehismsg.go:66）。
msgStoreEngine: mysql

log:
  logPath: ./logs
  logName: jim-info
  logExpireHours: 24

# 内置 KV 存储，数据落在 logPath/kvdb_data 下
kvdb:
  isOpen: true

mysql:
  user: root
  password: __DB_PASSWORD__
  address: 127.0.0.1:3306
  name: im_db

# mysql 模式下不使用，但保留结构便于切换
mongodb:
  address: 127.0.0.1:27017
  name: jim_msgs

# 服务端 REST API：只给业务层和运维工具用，不对外。
# ipWhitelist 在应用层再拦一道：即使防火墙被误开，非回环来源也拿不到 API。
apiGateway:
  httpPort: 65101
  ipWhitelist:
    - 127.0.0.1

# 客户端连接管理器
connectManager:
  wsPort: 65103

# Navigator：向客户端下发长连接地址
navGateway:
  httpPort: 65102

# 管理台：永远不要暴露到公网
adminGateway:
  httpPort: 65109

# 管理台 JWT 签名密钥。留空时引擎会用硬编码的默认值 jug9le1m
# （imserver-console@v1.0.10/apis/validate.go:91），等于任何人都能离线伪造管理台 token，必须设置。
# 必须与数据库口令不同源：用 openssl rand -base64 32 单独生成，
# 不要拿它复用 __DB_PASSWORD__。
adminSecret: __ADMIN_SECRET__

# 引擎内部调用自身 API 使用
imApiDomain: http://127.0.0.1:65101
