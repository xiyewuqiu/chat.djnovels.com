# 宿主机 Nginx 配置示例。
#
# 用法：
#   1. 把 api.example.com / im.example.com 替换成真实域名（两处 server_name 与证书路径）。
#   2. 证书：certbot --nginx -d api.example.com -d im.example.com
#   3. 安装到 /etc/nginx/conf.d/djnovels-im.conf 后 nginx -t && nginx -s reload
#
# 公网只开放 443。引擎的 9001（服务端 API）、9002（Navigator）、8090（管理台）
# 与 MySQL 的 3306 一律不出宿主机回环，禁止在此处添加代理。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=api_rl:20m rate=50r/s;
limit_conn_zone $binary_remote_addr zone=ws_conn:20m;

server {
    listen 80;
    server_name api.example.com im.example.com;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------
# 业务层 API：登录换 token、用户资料、好友、群、会话、历史。
# ---------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 文件上传走业务层签发的预签名 URL，正常请求体很小；留 1m 余量。
    client_max_body_size 1m;

    location / {
        limit_req zone=api_rl burst=100 nodelay;

        proxy_pass http://127.0.0.1:8070;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}

# ---------------------------------------------------------------
# 引擎长连接：只转发 WebSocket。
# ---------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name im.example.com;

    ssl_certificate     /etc/letsencrypt/live/im.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/im.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        limit_conn ws_conn 20;

        proxy_pass http://127.0.0.1:9003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接必须关掉缓冲与短超时，否则会周期性掉线。
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
